name: Build and push to ECR

on:
  push:
    paths-ignore:
      - '**.md'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Who am I in AWS
        run: aws sts get-caller-identity

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        run: docker build -t ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }} .

      - name: Push the image
        run: docker push ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }}
