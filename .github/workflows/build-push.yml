name: Build and push to ECR

on:
  push:
    paths-ignore:
      - '**.md'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Who am I in AWS
        run: aws sts get-caller-identity

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        run: docker build -t ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }} .

      - name: Test the image
        run: |
          docker run -d --name test-nginx -p 8080:80 ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080

      - name: Push the image
        run: docker push ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }}
      - name: Deploy to EC2
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/my-nginx:${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REGISTRY\",\"docker pull $IMAGE\",\"docker rm -f web || true\",\"docker run -d --name web -p 8080:80 $IMAGE\"]" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
